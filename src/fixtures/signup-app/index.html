<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Signup — BuildProof Target</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 400px; margin: 4rem auto; padding: 0 1rem; }
    form { display: flex; flex-direction: column; gap: 1rem; border: 1px solid #ddd; padding: 1.5rem; border-radius: 8px; }
    input { padding: 0.6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    input:invalid { border-color: #dc2626; }
    button { padding: 0.6rem; font-size: 1rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    #message { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; display: none; }
    #message.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; display: block; }
    #message.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
  </style>
</head>
<body>
  <h1>Créer un compte</h1>
  <form id="signupForm">
    <input type="email" id="email" placeholder="email@example.com" required />
    <input type="password" id="password" placeholder="Mot de passe (min. 8 caractères)" required minlength="8" />
    <button type="submit" id="submitBtn">S'inscrire</button>
  </form>
  <div id="message"></div>
  <script>
    const form = document.getElementById('signupForm');
    const message = document.getElementById('message');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Validation côté serveur simulée
      if (!email.includes('@') || !email.includes('.')) {
        showMessage('Email invalide.', 'error');
        return;
      }
      if (password.length < 8) {
        showMessage('Le mot de passe doit contenir au moins 8 caractères.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Traitement...';

      // Simuler un délai réseau
      await new Promise((r) => setTimeout(r, 800));

      showMessage('Compte créé avec succès.', 'success');
      btn.disabled = false;
      btn.textContent = 'S\'inscrire';
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
      message.style.display = 'block';
    }
  </script>
</body>
</html>
